<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canares Supplier Portal</title>
<meta name="theme-color" content="#0b5cab">
<meta name="description" content="Canares Supplier Portal: purchase orders, ASN, quality documents, RFQs and invoices.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Canares">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mu:#64707f;--bd:#e0e5ec;--pr:#0b5cab;--pr2:#e6f0fa;--ok:#1a7f4b;--wn:#b26a00;--er:#c62828}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#182029;--tx:#e8edf3;--mu:#93a0b0;--bd:#2a3542;--pr:#5aa5ee;--pr2:#1b2c40;--ok:#4cc38a;--wn:#f0a944;--er:#ef7b7b}}
:root[data-theme="dark"]{--bg:#10151c;--card:#182029;--tx:#e8edf3;--mu:#93a0b0;--bd:#2a3542;--pr:#5aa5ee;--pr2:#1b2c40;--ok:#4cc38a;--wn:#f0a944;--er:#ef7b7b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0}button,input,select{font:inherit}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn.o{background:none;color:var(--pr);border:1px solid var(--pr)}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
label{font-size:13px;color:var(--mu);display:block;margin:12px 0 4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:var(--pr)}
.logo i{width:34px;height:34px;border-radius:8px;background:var(--pr);color:#fff;display:grid;place-items:center;font-style:normal}
#login{min-height:100vh;display:grid;grid-template-columns:1.3fr 1fr}
.ann{padding:40px;overflow:auto;max-height:100vh}
.lg{display:grid;place-items:center;padding:24px;background:var(--pr2)}
.lgc{background:var(--card);padding:28px;border-radius:14px;width:100%;max-width:360px;border:1px solid var(--bd)}
.item{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-top:12px}
.item small{color:var(--mu)}.tag{font-size:11px;background:var(--pr2);color:var(--pr);padding:2px 8px;border-radius:99px;margin-left:6px;font-weight:600}
#app{display:none;min-height:100vh}
aside{position:fixed;left:0;top:0;bottom:0;width:230px;background:var(--card);border-right:1px solid var(--bd);padding:18px 12px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
aside nav{margin-top:22px}aside a{display:block;padding:10px 12px;border-radius:8px;color:var(--tx);cursor:pointer;margin-bottom:2px}
aside a.on{background:var(--pr2);color:var(--pr);font-weight:600}
main{margin-left:230px;padding:24px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}.kpi b{font-size:26px;display:block}.kpi span{color:var(--mu);font-size:13px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{text-align:left;color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase;padding:8px;border-bottom:1px solid var(--bd)}td{padding:10px 8px;border-bottom:1px solid var(--bd)}
.st{font-weight:600;font-size:12px}.ok{color:var(--ok)}.wn{color:var(--wn)}.er{color:var(--er)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:8px;display:none;z-index:9}
#mb{display:none}
@media(max-width:800px){#login{grid-template-columns:1fr}.ann{max-height:none;padding:24px;order:2}.lg{order:1}
aside{position:static;width:auto;border:0;border-bottom:1px solid var(--bd);padding-top:12px}aside nav{display:flex;gap:4px;overflow-x:auto;margin-top:10px}aside a{white-space:nowrap;margin:0}
main{margin-left:0;padding:16px}}
</style></head><body>

<section id="login">
 <div class="ann">
  <div class="logo"><i>C</i>Canares</div>
  <h2 style="margin-top:22px">Supplier Portal</h2>
  <p style="color:var(--mu)">Purchase orders, delivery schedules, quality documents and invoices in one place.</p>
  <div id="loginAnn"></div>
 </div>
 <div class="lg"><div class="lgc">
  <h3>Login</h3>
  <label>User ID</label><input id="u" value="SUP1001" autocomplete="username">
  <label>Password</label><input id="p" type="password" value="demo" autocomplete="current-password">
  <label style="display:flex;gap:8px;align-items:center;margin:14px 0"><input type="checkbox" style="width:auto"> Keep me signed in</label>
  <button class="btn" style="width:100%" onclick="login()">Login</button>
  <p style="text-align:center;margin:14px 0 0"><a href="#" onclick="toast('Password reset link sent (demo)');return false" style="color:var(--pr)">Forgot your password?</a></p>
  <p style="font-size:12px;color:var(--mu);text-align:center">Demo: any User ID and password works.</p>
 </div></div>
</section>

<section id="app">
 <aside><div class="logo"><i>C</i>Canares</div><nav id="nav"></nav></aside>
 <main>
  <div class="top"><div><h2 id="ttl"></h2><small style="color:var(--mu)" id="sub"></small></div>
   <div><button class="btn o" onclick="logout()">Logout</button></div></div>
  <div id="view"></div>
 </main>
</section>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const ANN=[
 {d:"30 Sep 2026",t:"Plant shutdown for stock-taking",p:"All plants",b:"No material inward on 3–4 Oct. Please plan dispatches accordingly."},
 {d:"18 Sep 2026",t:"FIP / FIR upload mandatory",p:"All plants",b:"Upload Final Inspection Plan and Report with every ASN before dispatch."},
 {d:"05 Sep 2026",t:"Use official company email domains",p:"All plants",b:"Business communication from generic email domains will not be accepted."}];
let PO=[
 ["PO-24501","Shaft, Ground Ø32","Plant 1",500,"05 Oct 2026","Open"],
 ["PO-24502","Bearing Housing","Plant 2",240,"08 Oct 2026","Open"],
 ["PO-24488","Bracket Assy","Plant 1",1200,"01 Oct 2026","Delayed"],
 ["PO-24470","Gasket Set","Plant 3",800,"28 Sep 2026","Delivered"],
 ["PO-24519","Fastener Kit M8","Plant 2",3000,"12 Oct 2026","Open"]];
let INV=[["INV-9012","PO-24470","₹ 1,84,000","28 Sep 2026","Under review"],["INV-8990","PO-24431","₹ 3,20,500","14 Sep 2026","Paid"],["INV-8974","PO-24402","₹ 96,750","06 Sep 2026","Paid"]];
let DOC=[["FIP-1188","PO-24501","Approved"],["FIR-2210","PO-24470","Approved"],["FIR-2231","PO-24488","Pending review"]];
const RFQ=[["RFQ-3301","Motor Cover, Die-cast","10 Oct 2026","Open"],["RFQ-3297","Impeller Blade","06 Oct 2026","Open"],["RFQ-3280","Seal Ring","25 Sep 2026","Closed"]];
const cls=s=>({Open:"wn",Delayed:"er",Delivered:"ok",Paid:"ok",Approved:"ok",Closed:"","Under review":"wn","Pending review":"wn","Submitted":"ok"}[s]||"");
const tbl=(h,r)=>`<div class="sc"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(x=>`<tr>${x.map((c,i)=>i==x.length-1&&cls(c)!==undefined&&h[i]=="Status"?`<td><span class="st ${cls(c)}">${c}</span></td>`:`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
const annHtml=()=>ANN.map(a=>`<div class="item"><small>${a.d}</small><span class="tag">${a.p}</span><div style="font-weight:600;margin:4px 0">${a.t}</div><div style="color:var(--mu)">${a.b}</div></div>`).join("");
$("loginAnn").innerHTML=annHtml();

const V={
 Dashboard(){const o=PO.filter(x=>x[5]=="Open").length,d=PO.filter(x=>x[5]=="Delayed").length;
  return `<div class="grid"><div class="kpi"><b>${o}</b><span>Open POs</span></div><div class="kpi"><b class="er">${d}</b><span>Delayed deliveries</span></div><div class="kpi"><b>${RFQ.filter(x=>x[3]=="Open").length}</b><span>RFQs awaiting quote</span></div><div class="kpi"><b>${DOC.filter(x=>x[2]!="Approved").length}</b><span>FIR pending review</span></div></div>
  <div class="box"><h3>Upcoming deliveries</h3>${tbl(["PO","Item","Plant","Qty","Due","Status"],PO.filter(x=>x[5]!="Delivered"))}</div>
  <div class="box"><h3>Announcements</h3>${annHtml()}</div>`},
 "Purchase Orders"(){return `<div class="box">${tbl(["PO","Item","Plant","Qty","Due","Status"],PO)}</div>`},
 "Delivery / ASN"(){return `<div class="box"><h3>Create Advance Shipping Notice</h3>
  <div class="row"><div><label>Purchase Order</label><select id="ap">${PO.filter(x=>x[5]!="Delivered").map(x=>`<option>${x[0]}</option>`).join("")}</select></div>
  <div><label>Dispatch quantity</label><input id="aq" type="number" min="1" placeholder="e.g. 250"></div>
  <div><label>Dispatch date</label><input id="ad" type="date"></div></div>
  <div class="row"><div><label>Vehicle / LR number</label><input id="av"></div><div><label>Invoice number</label><input id="ai"></div></div>
  <p style="color:var(--mu);font-size:13px">FIP/FIR must be uploaded under Quality Documents before dispatch.</p>
  <button class="btn" onclick="asn()">Submit ASN</button></div>`},
 "Quality Documents"(){return `<div class="box"><h3>Upload FIP / FIR</h3>
  <div class="row"><div><label>Type</label><select id="dt"><option>FIP</option><option>FIR</option></select></div>
  <div><label>PO number</label><select id="dp">${PO.map(x=>`<option>${x[0]}</option>`).join("")}</select></div>
  <div><label>File</label><input id="df" type="file"></div></div><br><button class="btn" onclick="doc()">Upload</button></div>
  <div class="box"><h3>Submitted documents</h3>${tbl(["Document","PO","Status"],DOC)}</div>`},
 RFQs(){return `<div class="box">${tbl(["RFQ","Item","Closes","Status"],RFQ)}</div>`},
 Invoices(){return `<div class="box">${tbl(["Invoice","PO","Amount","Date","Status"],INV)}</div>`},
 Announcements(){return `<div class="box">${annHtml()}</div>`}
};
let cur="Dashboard";
function nav(n){cur=n;$("ttl").textContent=n;$("sub").textContent="Supplier ID: "+($("u").value||"SUP1001");
 $("nav").innerHTML=Object.keys(V).map(k=>`<a class="${k==n?"on":""}" onclick="nav('${k}')">${k}</a>`).join("");$("view").innerHTML=V[n]();}
function login(){if(!$("u").value||!$("p").value)return toast("Enter User ID and password");$("login").style.display="none";$("app").style.display="block";nav("Dashboard")}
function logout(){$("app").style.display="none";$("login").style.display="grid"}
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2600)}
function asn(){if(!$("aq").value||!$("ad").value)return toast("Enter quantity and dispatch date");toast("ASN submitted for "+$("ap").value);nav("Purchase Orders")}
function doc(){if(!$("df").files.length)return toast("Choose a file to upload");DOC.unshift([$("dt").value+"-"+(2300+DOC.length),$("dp").value,"Pending review"]);toast("Document uploaded");nav("Quality Documents")}

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
let dp;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;const b=document.createElement("button");b.className="btn o";b.textContent="Install app";b.style.marginRight="8px";b.onclick=async()=>{dp.prompt();await dp.userChoice;b.remove()};const t=document.querySelector(".top div:last-child");if(t)t.prepend(b)});
</script></body></html>
